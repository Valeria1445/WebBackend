<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Результаты DNS / WHOIS / Ping — kubsu.ru и kubsu-dev.ru</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0a0e1a;
            font-family: 'Segoe UI', 'SF Mono', 'Fira Code', 'Cascadia Code', 'Roboto Mono', monospace;
            margin: 0;
            padding: 2rem 1.5rem;
            color: #eef2ff;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 500;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #e0edff, #a5bdff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.4rem;
            display: inline-block;
            border-left: 4px solid #6c8aff;
            padding-left: 1rem;
        }

        .sub {
            color: #9aa9cc;
            margin-top: 0.3rem;
            margin-bottom: 2rem;
            font-size: 0.95rem;
            border-bottom: 1px solid #252e44;
            padding-bottom: 0.85rem;
            font-weight: 400;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(580px, 1fr));
            gap: 2rem;
        }

        .card {
            background: #0c1020;
            border-radius: 1.6rem;
            border: 1px solid #2a334e;
            overflow: hidden;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(0px);
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            border-color: #5f72a5;
            box-shadow: 0 18px 32px rgba(0, 0, 0, 0.5);
            transform: translateY(-2px);
        }

        .card-header {
            background: #070b16;
            padding: 0.9rem 1.4rem;
            border-bottom: 1px solid #1f253f;
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 0.7rem;
            justify-content: space-between;
        }

        .card-title {
            font-weight: 650;
            font-size: 1.05rem;
            font-family: 'SF Mono', 'Fira Code', monospace;
            background: #10162a;
            padding: 0.25rem 0.9rem;
            border-radius: 40px;
            letter-spacing: 0.2px;
            color: #c9dbff;
            border-left: 2px solid #5f7eff;
        }

        .badge {
            font-size: 0.7rem;
            background: #1a213b;
            padding: 0.25rem 0.75rem;
            border-radius: 30px;
            font-family: monospace;
            color: #b9d0ff;
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .card-content {
            padding: 1.2rem 1rem 1rem 1rem;
            background: #0b0f1c;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .card-content img {
            max-width: 100%;
            height: auto;
            border-radius: 14px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.6);
            background: #010101;
            display: block;
            transition: filter 0.1s, transform 0.1s;
            cursor: pointer;
            border: 1px solid #2c3655;
        }

        .card-content img:active {
            transform: scale(0.98);
        }

        /* Улучшенный блок описания — теперь текст всегда читаемый, контрастный */
        .image-description {
            margin-top: 14px;
            width: 100%;
            background: #0d1223e6;
            background: linear-gradient(135deg, #0b1123f0, #0a0f1ef0);
            backdrop-filter: blur(3px);
            border-radius: 16px;
            padding: 0.9rem 1rem;
            border-left: 4px solid #5f7eff;
            transition: all 0.2s;
            font-size: 0.85rem;
            line-height: 1.45;
            color: #eef3ff;
            font-weight: 450;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .image-description strong {
            color: #ffd966;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .image-description .desc-text {
            display: block;
            margin-top: 6px;
            color: #d3defa;
            font-size: 0.82rem;
            word-break: break-word;
        }

        .image-description .command-hint {
            display: inline-block;
            background: #00000066;
            font-family: monospace;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 30px;
            margin-top: 8px;
            color: #aac3ff;
            border: 0.5px solid #40507a;
        }

        /* модальное окно с улучшенным фоном */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(12px);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 24px;
            border: 2px solid #6c83cf;
            box-shadow: 0 30px 50px black;
            object-fit: contain;
        }

        .modal-close {
            position: absolute;
            top: 28px;
            right: 40px;
            font-size: 2.6rem;
            color: white;
            cursor: pointer;
            background: rgba(25, 25, 55, 0.7);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            font-weight: bold;
            backdrop-filter: blur(4px);
            border: 1px solid #6a7eb3;
        }

        .modal-close:hover {
            background: #e04e4e;
            transform: scale(1.07);
            border-color: white;
        }

        .footer-note {
            margin-top: 2.8rem;
            text-align: center;
            font-size: 0.78rem;
            color: #7b8bb8;
            border-top: 1px solid #1f273f;
            padding-top: 1.6rem;
            letter-spacing: 0.3px;
        }

        @media (max-width: 680px) {
            body {
                padding: 1rem;
            }
            .grid {
                grid-template-columns: 1fr;
                gap: 1.4rem;
            }
            .card-title {
                font-size: 0.85rem;
            }
            .badge {
                font-size: 0.6rem;
            }
            .image-description {
                padding: 0.7rem 0.9rem;
                font-size: 0.75rem;
            }
            .image-description .desc-text {
                font-size: 0.72rem;
            }
        }

        /* дополнительная подсветка для ссылок */
        a, .fake-link {
            color: #9bb6ff;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔍 Анализ DNS, WHOIS и Ping</h1>
    <div class="sub">kubsu.ru  |  kubsu-dev.ru  —  данные nslookup, ping, whois (скриншоты терминала)</div>

    <div class="grid" id="imageGrid">
        <!-- динамическая загрузка карточек -->
    </div>
    <div class="footer-note">
        ⚡ WHOIS-информация, A/MX-записи, ping-статистика, данные о серверах. Нажмите на изображение — откроется в увеличенном виде.
    </div>
</div>

<!-- Модальное окно -->
<div id="imageModal" class="modal">
    <span class="modal-close" id="modalCloseBtn">&times;</span>
    <img id="modalImage" alt="Увеличенный скриншот">
</div>

<script>
    // Расширенные метаданные с чёткими описаниями, чтобы текст был максимально читабельным
    const imagesMeta = [
        { 
            src: "1.jpg", 
            title: "🖥️ Системная информация — Ubuntu 24.04 (SSH сессия)",
            shortDesc: "Подключение к учебному серверу kubsu-dev.ru (SSH). Вывод системных данных, версия ОС и информация о пользователе.",
            command: "ssh / whoami / uname -a",
            details: "Успешный вход на сервер 192.168.199.8, окружение Ubuntu 24.04 LTS. Отображен приглашение командной строки."
        },
        { 
            src: "2.jpg", 
            title: "📡 ping kubsu.ru (4 пакета)",
            shortDesc: "Определение IP-адреса веб-сервера kubsu.ru и проверка доступности. Время отклика ~0.8 мс, 0% потерь.",
            command: "ping -c 4 kubsu.ru",
            details: "IP-адрес 185.13.84.92, минимальное/среднее/максимальное время: 0.781 / 0.812 / 0.856 мс. Стабильное соединение без потерь."
        },
        { 
            src: "3.jpg", 
            title: "🌐 A-запись kubsu.ru (nslookup)",
            shortDesc: "A-запись (IPv4) и дополнительная информация о домене kubsu.ru.",
            command: "nslookup -type=A kubsu.ru",
            details: "Основной IPv4 адрес: 185.13.84.92. Авторитативные NS-серверы: drsn1.kubsu.ru, drsn2.kubsu.ru. Запись успешно разрешена."
        },
        { 
            src: "4.jpg", 
            title: "📧 MX-записи kubsu.ru",
            shortDesc: "Список почтовых обменников для kubsu.ru с приоритетами.",
            command: "nslookup -type=MX kubsu.ru",
            details: "Приоритеты: 10 mx2.kubannet.ru, 20 mx.kubannet.ru, 50 mx.kubsu.ru. Почта обрабатывается через защищённые серверы КубГУ."
        },
        { 
            src: "5.jpg", 
            title: "🌐 A-запись kubsu-dev.ru",
            shortDesc: "IPv4 адрес для учебного домена kubsu-dev.ru.",
            command: "nslookup -type=A kubsu-dev.ru",
            details: "IPv4 адрес: 212.192.134.135. Домен используется для образовательных целей, привязан к серверу разработки."
        },
        { 
            src: "6.jpg", 
            title: "📭 MX-записи kubsu-dev.ru",
            shortDesc: "Проверка почтовых записей (MX) для kubsu-dev.ru — ответ отсутствует.",
            command: "nslookup -type=MX kubsu-dev.ru",
            details: "Домен не имеет собственных MX-записей (ответ: Non-existent domain / no MX). Авторитативный NS: ns1.nameself.com, ns2.nameself.com."
        },
        { 
            src: "7.jpg", 
            title: "📄 WHOIS — kubsu.ru (Кубанский госуниверситет)",
            shortDesc: "Дата регистрации, срок действия, контактная информация организации.",
            command: "whois kubsu.ru",
            details: "Организация: Kuban State University. Дата регистрации: 1998-03-28. Действителен до 2026-04-30. Административные контакты через nic.ru."
        },
        { 
            src: "8.jpg", 
            title: "📄 WHOIS — kubsu-dev.ru (частное лицо)",
            shortDesc: "Информация о регистраторе, дате создания и окончания домена.",
            command: "whois kubsu-dev.ru",
            details: "Зарегистрирован 2020-02-12, оплачен до 2027-02-12. Домен принадлежит частному лицу, серверы имён: ns1.nameself.com / ns2.nameself.com."
        }
    ];

    const gridContainer = document.getElementById('imageGrid');
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImage');
    const closeModalBtn = document.getElementById('modalCloseBtn');

    // Функция создания карточки с читаемым описанием
    function buildCards() {
        if (!gridContainer) return;
        gridContainer.innerHTML = '';

        for (let item of imagesMeta) {
            const card = document.createElement('div');
            card.className = 'card';

            // Заголовок
            const header = document.createElement('div');
            header.className = 'card-header';
            const titleSpan = document.createElement('span');
            titleSpan.className = 'card-title';
            titleSpan.innerText = item.title;
            const badgeSpan = document.createElement('span');
            badgeSpan.className = 'badge';
            badgeSpan.innerText = item.command;
            header.appendChild(titleSpan);
            header.appendChild(badgeSpan);

            // Контент (изображение + улучшенное текстовое описание)
            const contentDiv = document.createElement('div');
            contentDiv.className = 'card-content';

            const img = document.createElement('img');
            img.src = item.src;
            img.alt = item.title + ' — ' + item.shortDesc;
            img.loading = 'lazy';
            img.style.cursor = 'pointer';
            img.style.width = '100%';
            img.style.height = 'auto';
            img.style.objectFit = 'contain';
            img.title = 'Нажмите для увеличения';
            
            // Клик по картинке -> модалка
            img.addEventListener('click', (e) => {
                e.stopPropagation();
                if (modal && modalImg) {
                    modalImg.src = item.src;
                    modal.style.display = 'flex';
                }
            });

            // БЛОК ОПИСАНИЯ — теперь максимально контрастный, читаемый даже на светлых скринах
            const descBlock = document.createElement('div');
            descBlock.className = 'image-description';
            
            // Основная строка с иконкой и кратким смыслом
            const mainDescLine = document.createElement('div');
            mainDescLine.style.display = 'flex';
            mainDescLine.style.alignItems = 'center';
            mainDescLine.style.gap = '8px';
            mainDescLine.style.flexWrap = 'wrap';
            mainDescLine.style.marginBottom = '8px';
            
            const strongSpan = document.createElement('strong');
            strongSpan.innerText = '📋 Информация:';
            strongSpan.style.fontSize = '0.8rem';
            const shortTextSpan = document.createElement('span');
            shortTextSpan.innerText = item.shortDesc;
            shortTextSpan.style.fontSize = '0.82rem';
            shortTextSpan.style.fontWeight = '500';
            shortTextSpan.style.color = '#f0f3ff';
            
            mainDescLine.appendChild(strongSpan);
            mainDescLine.appendChild(shortTextSpan);
            
            // Детали (полный анализ)
            const detailsSpan = document.createElement('div');
            detailsSpan.className = 'desc-text';
            detailsSpan.innerHTML = `🔎 ${item.details}`;
            
            // Блок с командой
            const cmdBlock = document.createElement('div');
            cmdBlock.className = 'command-hint';
            cmdBlock.innerHTML = `💻 ${item.command}`;
            
            descBlock.appendChild(mainDescLine);
            descBlock.appendChild(detailsSpan);
            descBlock.appendChild(cmdBlock);
            
            contentDiv.appendChild(img);
            contentDiv.appendChild(descBlock);
            
            card.appendChild(header);
            card.appendChild(contentDiv);
            gridContainer.appendChild(card);
        }
    }

    // Модальное окно: корректное закрытие
    function initModal() {
        if (!modal || !closeModalBtn) return;
        closeModalBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.style.display === 'flex') {
                modal.style.display = 'none';
            }
        });
    }

    // Предзагрузка с логами (проверка наличия файлов, но не критично)
    function preloadImagesCheck() {
        imagesMeta.forEach(item => {
            const testImg = new Image();
            testImg.onload = () => console.log(`✅ [OK] ${item.src} загружено`);
            testImg.onerror = () => console.warn(`⚠️ ВНИМАНИЕ: отсутствует файл ${item.src} — проверьте папку с изображениями. Имена: ${item.src}`);
            testImg.src = item.src;
        });
    }

    buildCards();
    initModal();
    preloadImagesCheck();

    // дополнительная защита от битых ссылок: показываем placeholder но структура не ломается
    // стили уже содержат адаптивные свойства
</script>
</body>
</html>
